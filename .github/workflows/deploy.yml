name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://worthsprout.com
          NEXT_PUBLIC_WORDPRESS_API_BASE_URL: https://cms.worthsprout.com/wp-json

      - name: Check required secrets
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN is missing or empty."
            missing=1
          else
            echo "CLOUDFLARE_API_TOKEN: present"
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is missing or empty."
            missing=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID: present"
          fi
          exit $missing

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy out --project-name=worthsprout --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

